name: CI

on: push

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: python -m pytest
        continue-on-error: true

      - name: Send report to local receiver
        if: always()
        run: python send_report.py
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      - name: Build email summary
        if: always()
        run: python make_summary.py

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          to: ${{ secrets.REPORT_EMAIL }}
          from: CI Bot
          subject: 'CI ${{ steps.tests.outcome }} - ${{ github.sha }}'
          body: file://email_body.txt
          attachments: report.json

      - name: Fail the pipeline if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
