name: CI

on: push

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: python -m pytest
        continue-on-error: true

      - name: Send report to local receiver
        if: always()
        run: python send_report.py
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      - name: Build email summary
        if: always()
        run: python make_summary.py

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          to: ${{ secrets.REPORT_EMAIL }}
          from: CI Bot
          subject: "CI ${{